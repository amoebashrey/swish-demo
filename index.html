<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swish Concept Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a phone-width app that looks like Swish. Prototype only; the case study lives in the slide deck. One deliberate light look, matching the real app. */
:root{
  --green:#2dbe5f; --green-d:#1f9a4a; --green-xd:#14532d; --mint:#e9f8ee; --leaf:#d3f1dd;
  --yellow:#fff6d8; --yellow-d:#e2b32c; --ink:#1b1f1c; --muted:#6b736d; --line:#e7ebe8; --bg:#f3f5f3; --card:#ffffff;
  --red:#d94a3a; --red-soft:#fdeceb; --ring:#ffcf33;
  --sans:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;margin:0;padding-inline:16px;padding-block:0 40px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
a{color:var(--green-d)}
.topbar{max-width:420px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:14px}
.topbar .who{font-size:13px;color:var(--muted)}
.topbar .who b{color:var(--ink)}
.toplinks{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.pill.solid{background:var(--green-xd);border-color:var(--green-xd);color:#fff}
.stage{max-width:420px;margin:0 auto;display:block}
@media (max-width:900px){.stage{grid-template-columns:1fr}.rail{order:-1}}
.phone{background:#0d120f;border-radius:40px;padding:10px;width:100%;max-width:400px;margin-inline:auto}
.screen{background:var(--card);border-radius:31px;height:760px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto}
.sb{display:flex;justify-content:space-between;font:600 12px var(--sans);padding:10px 22px 0;color:#fff}
.sb.dark{color:var(--ink)}
.label-concept{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;font-size:10px;color:var(--muted);background:#ffffffd9;padding:2px 8px;border-radius:999px;white-space:nowrap}

/* app chrome */
.hdr{background:linear-gradient(180deg,#3fd06f 0%,#2dbe5f 100%);color:#fff;padding:6px 18px 18px}
.hdr .eta{font-weight:800;font-size:26px;letter-spacing:-.01em}
.hdr .addr{font-size:13px;opacity:.95;display:flex;gap:6px;align-items:center}
.hdr .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green-xd);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;border:0}
.search{margin-top:12px;background:#fff;border-radius:14px;padding:11px 14px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between}
.search .veg{font-size:11px;font-weight:700;color:var(--green-d);border:1px solid var(--leaf);padding:1px 6px;border-radius:6px}
.sec{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.offer{background:var(--yellow);border-radius:16px;padding:12px 14px;font-size:13px}
.offer b{display:block;font-size:15px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink);background:none;border:0;padding:0}
.tile{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.t1{background:#ffe9cc;color:#a35a00}.t2{background:#ffe0e4;color:#a3243c}.t3{background:#e6f0ff;color:#2851a3}.t4{background:#efe6ff;color:#5b34a3}.t5{background:var(--leaf);color:var(--green-xd)}.t6{background:#fff3c4;color:#8a6a00}
.h3{font-weight:800;font-size:17px;margin:0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.usual{background:linear-gradient(135deg,#f0fbf3,#fffbe9);border:1px solid var(--leaf)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--mint);color:var(--green-xd)}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.amber{background:var(--yellow);color:#8a6a00}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px}
.btn.g{background:var(--green);color:#fff}
.btn.o{background:#fff;border:1.5px solid var(--green);color:var(--green-d)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sq{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:12px}
.item b{display:block;font-size:14px}
.vegdot{display:inline-block;width:10px;height:10px;border:1.5px solid var(--green-d);border-radius:2px;position:relative;margin-right:4px;vertical-align:-1px}
.vegdot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--green-d)}
.sticky{position:sticky;bottom:0;background:#fff;padding:10px 16px 26px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.back{background:#f1f3f2;border:0;border-radius:50%;width:36px;height:36px;font-size:18px}
.topline{display:flex;gap:10px;align-items:center;padding:8px 16px}
.topline .eta{font-weight:800;color:var(--green-d);font-size:18px;line-height:1.1}
.bill .r{display:flex;justify-content:space-between;font-size:14px}
.bill .r .v{font-family:var(--mono)}
.saved{background:#fde7f3;color:#a3236b;font-weight:700;font-size:13px;text-align:center;padding:8px;border-radius:0}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;padding:8px 0;font-size:14px;color:var(--muted)}
.steps .d{width:12px;height:12px;border-radius:50%;border:2px solid #c7cec9;margin-top:5px}
.steps li.done{color:var(--ink)} .steps li.done .d{background:var(--green);border-color:var(--green)}
.steps .t{font-family:var(--mono);font-size:12px}
.banner{border-radius:14px;padding:12px 14px;font-size:13.5px}
.banner.g{background:var(--mint)} .banner.r{background:var(--red-soft)} .banner.y{background:var(--yellow)}
.big{font-weight:800;font-size:20px;display:block}
.opt{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;width:100%;text-align:left;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--mint)}
.toast{position:absolute;left:12px;right:12px;top:44px;background:var(--green-xd);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;box-shadow:0 8px 24px #0003;z-index:5}
.notif{background:#ffffffee;border-radius:16px;padding:10px 12px;font-size:13px;box-shadow:0 6px 20px #0002;display:grid;grid-template-columns:30px 1fr;gap:10px}
.notif .ic{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.tabbar{display:flex;border-top:1px solid var(--line);background:#fff;padding:6px 6px 18px}
.tabbar button{flex:1;background:none;border:0;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0}
.tabbar button[aria-current="page"]{color:var(--green-d)}

/* glowing entry points */
.ring{position:relative;box-shadow:0 0 0 3px var(--ring),0 0 18px 4px #ffcf3399;border-radius:16px}
.ring>.newtag{position:absolute;top:-10px;right:10px;background:var(--ring);color:#3d2e00;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.04em}
@media (prefers-reduced-motion:no-preference){.ring{animation:glow 2.2s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 3px var(--ring),0 0 26px 8px #ffcf3366}}}

/* kitchen (Station) */
.station{background:#101614;color:#eaf2ec;min-height:100%}
.station .sb{color:#eaf2ec}
.st-h{padding:6px 16px 12px;display:flex;justify-content:space-between;align-items:center}
.st-h b{font-size:18px}
.st-card{background:#1a2420;border:1px solid #2a3832;border-radius:14px;padding:12px;margin:0 14px 10px;display:flex;flex-direction:column;gap:8px}
.st-card .muted{color:#9fb3a7}
.dishrow{display:grid;grid-template-columns:1fr repeat(3,44px);gap:6px;align-items:center;font-size:13px}
.cell{text-align:center;border-radius:8px;padding:4px 0;font-family:var(--mono);font-size:12px;background:#24312b}
.cell.h1{background:#5a4a16;color:#ffe08a}.cell.h2{background:#6b2a22;color:#ffb3a6}
.tkt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#1a2420;border:1px solid #2a3832;border-radius:12px;padding:10px;margin:0 14px 8px;font-size:13px}
.btn.stop{background:#d94a3a;color:#fff}
.btn.dk{background:#24312b;color:#eaf2ec;border:1px solid #33443b}

/* rider */
.rider{background:#fff;min-height:100%}
.alert{margin:12px 14px;border-radius:18px;background:var(--green-xd);color:#fff;padding:16px;display:flex;flex-direction:column;gap:8px}
.alert .big{font-size:24px}

/* persona picker */
.who-wrap{padding:8px 18px 18px;display:flex;flex-direction:column;gap:10px}
.persona{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%}
.persona .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.persona b{display:block}

.disc{font-size:12px;color:var(--muted)}

.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d)}
.lead{font-size:18px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.fact b{display:block;font-size:22px;font-weight:800;font-family:var(--sans)}
.fact span{font-size:12.5px;color:var(--muted)}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:580px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);white-space:nowrap}
.up{color:var(--red);font-weight:700}.down{color:var(--green-d);font-weight:700}
blockquote{margin:0;background:#fff;border-left:4px solid var(--green);border-radius:0 12px 12px 0;padding:10px 14px}
blockquote cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px}
.chart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.bets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.bets{grid-template-columns:1fr}}
.bet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bet .eyebrow{font-size:11px}
.src{font-size:12.5px;color:var(--muted)}
.lbl{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--bg);color:var(--muted)}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:700;cursor:pointer}
</style>

</head>
<body>
<header class="topbar">
  <div class="who">Concept demo for Swish · <b>Unofficial concept by Shreyas Jadhav. Not affiliated with Swish.</b></div>
  <nav class="toplinks">
    <a class="pill" href="#who" id="nav-who">Switch person</a>
  </nav>
</header>

<main id="app-view" class="stage">
  <div class="phone"><div class="screen" id="screen"></div></div>
</main>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const PEOPLE={
    ananya:{name:"Ananya",role:"Product designer, HSR Layout",note:"Orders lunch most weekdays",init:"AN",color:"#2dbe5f",kind:"customer",addr:"HSR Layout, Sector 2",kitchen:"HSR kitchen"},
    rohit:{name:"Rohit",role:"Student, Noida Sector 62",note:"Morning chai, late-night snacks",init:"RO",color:"#3b6fd8",kind:"customer",addr:"Sector 62, Noida",kitchen:"Sector 62 kitchen"},
    meera:{name:"Meera",role:"Kitchen lead, HSR kitchen",note:"Runs the lunch shift",init:"ME",color:"#1b1f1c",kind:"kitchen"},
    imran:{name:"Imran",role:"Delivery partner, HSR",note:"Lunch shift, 12 pm to 4 pm",init:"IM",color:"#c7841a",kind:"rider"}
  };
  const MENU=[
    {id:"rajma",name:"Rajma chawal bowl",price:149,tag:"RC",cls:"t1"},
    {id:"chai",name:"Ginger chai",price:39,tag:"GC",cls:"t6"},
    {id:"poha",name:"Indori poha",price:79,tag:"IP",cls:"t5"},
    {id:"paneer",name:"Paneer tikka roll",price:159,tag:"PT",cls:"t2"},
    {id:"idli",name:"Tofu stuffed idli",price:169,tag:"TI",cls:"t3"},
    {id:"gulab",name:"Gulab jamun",price:59,tag:"GJ",cls:"t4"}
  ];
  const item=id=>MENU.find(m=>m.id===id);
  let S;
  function reset(){S={person:null,cart:{},wallet:0,toast:"",usualSet:false,usualTime:"1:00 pm",issue:{type:null,item:null,mode:"wallet",done:false},
    orders:[
      {id:"#4821",when:"Yesterday, 1:04 pm",items:{rajma:1,chai:1},total:188,promised:"1:16 pm",arrived:"1:15 pm",late:0},
      {id:"#4790",when:"Mon, 1:02 pm",items:{rajma:1},total:149,promised:"1:13 pm",arrived:"1:22 pm",late:9}
    ],
    track:null,paused:{paneer:true},stopped:{},riderAccepted:false};}
  reset();

  function rupee(n){return "₹"+n}
  function cartCount(){return Object.values(S.cart).reduce((a,b)=>a+b,0)}
  function cartTotal(){return Object.entries(S.cart).reduce((s,[k,v])=>s+item(k).price*v,0)}
  function sb(dark){return `<div class="sb ${dark?'dark':''}"><span>12:55</span><span>5G</span></div>`}
  function tabbar(cur){return `<nav class="tabbar">${[["home","Home"],["orders","Orders"],["wallet","Wallet"]].map(([r,l])=>`<button data-go="${r}" ${cur===r?'aria-current="page"':''}>${l}</button>`).join("")}</nav>`}
  function toast(){return S.toast?`<div class="toast" role="status">${S.toast}</div>`:""}

  /* ---------- screens ---------- */
  const SCREENS={
    who(){return `${sb(true)}<div class="who-wrap"><div class="h3" style="font-size:22px;margin-top:8px">Who are you?</div>
      <p class="muted" style="margin:0">Pick someone to try it as. They're all made up. Anything glowing yellow is new; the rest is the Swish app as it is today.</p>
      ${Object.entries(PEOPLE).map(([k,p])=>`<button class="persona" data-person="${k}"><span class="av" style="background:${p.color}">${p.init}</span><span><b>${p.name}</b><span class="muted">${p.role} · ${p.note}</span></span></button>`).join("")}
      </div>`},

    home(){const p=PEOPLE[S.person];
      const usualItems=S.person==="rohit"?{chai:1,poha:1}:{rajma:1,chai:1};
      const uTotal=Object.entries(usualItems).reduce((s,[k,v])=>s+item(k).price*v,0);
      const uLabel=S.person==="rohit"?"9 am usual":"1 pm usual";
      return `<div class="hdr">${sb()}<div class="row1"><div><div class="eta">10 Minutes</div><div class="addr">${p.addr}</div></div><button class="avatar" data-go="who" aria-label="Switch person">${p.init}</button></div>
        <div class="search"><span>Search "Dum Biryani"</span><span class="veg">VEG</span></div></div>
        <div class="scroll"><div class="sec">
          <div class="card usual ring"><span class="newtag">NEW</span>
            <div style="display:flex;justify-content:space-between;align-items:center"><b>Your ${uLabel}</b><span class="chip">Ordered 6 times</span></div>
            <div class="muted">${Object.keys(usualItems).map(k=>item(k).name).join(" + ")} · ${rupee(uTotal)}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g sm" data-usual="${Object.keys(usualItems).join(',')}">Order again</button>
            <button class="btn o sm" data-go="usual">${S.usualSet?"Weekdays at "+S.usualTime+" ✓":"Remind me on weekdays"}</button></div>
          </div>
          <div class="offer"><b>50% off unlocked</b>Use code TRY50 · free delivery</div>
          <div class="cats">${[["Snacks","t1"],["Cold Beverages","t2"],["Sandwiches & Rolls","t3"],["Desserts","t4"],["Chaats","t6"],["Hot Beverages","t5"],["Pasta & Maggi","t3"],["Protein","t5"]].map(([n,c])=>`<button class="cat" data-go="menu"><span class="tile ${c}">${n.split(" ").map(w=>w[0]).join("").slice(0,2)}</span>${n}</button>`).join("")}</div>
          <div class="h3">Lunch picks</div>
          ${MENU.slice(0,4).map(menuRow).join("")}
        </div></div>
        ${cartCount()?`<div class="sticky"><button class="btn g full" data-go="cart">View cart · ${cartCount()} item${cartCount()>1?"s":""} · ${rupee(cartTotal())}</button></div>`:""}
        ${tabbar("home")}`},

    menu(){return `${sb(true)}<div class="topline"><button class="back" data-go="home" aria-label="Back">‹</button><b>Lunch</b></div>
      <div class="scroll"><div class="sec">${MENU.map(menuRow).join("")}</div></div>
      ${cartCount()?`<div class="sticky"><button class="btn g full" data-go="cart">View cart · ${rupee(cartTotal())}</button></div>`:""}`},

    cart(){const t=cartTotal(),disc=Math.min(150,Math.floor(t*0.5));
      return `${sb(true)}<div class="topline"><button class="back" data-go="home" aria-label="Back">‹</button><div><div class="eta">12 Minutes</div><div class="muted">${PEOPLE[S.person].addr}</div></div></div>
      <div class="saved">You saved ${rupee(disc+29)} (${rupee(disc)} with TRY50 + ₹29 delivery)</div>
      <div class="scroll"><div class="sec">
        <div class="card">${Object.entries(S.cart).map(([k,v])=>`<div class="bill"><div class="r"><span>${v} × ${item(k).name}</span><span class="v">${rupee(item(k).price*v)}</span></div></div>`).join("")}</div>
        <div class="card bill"><div class="r"><span>Item total</span><span class="v">${rupee(t)}</span></div><div class="r"><span>Discount (TRY50)</span><span class="v">−${rupee(disc)}</span></div><div class="r"><span>Delivery fee</span><span class="v"><s>₹29</s> FREE</span></div><div class="r"><b>To pay</b><b class="v">${rupee(t-disc)}</b></div></div>
        
      </div></div>
      <div class="sticky"><button class="btn g full" id="place">Pay ${rupee(t-disc)}</button></div>`},

    track(){const o=S.track; const st=["Order received","Cooking","Packed","Rider on the way","Delivered"];
      return `${sb(true)}<div class="topline"><button class="back" data-go="home" aria-label="Back">‹</button><div><div class="eta">${o.step<4?"Arriving by 1:08 pm":"Delivered"}</div><div class="muted">Order ${o.id}</div></div></div>
      <div class="scroll"><div class="sec"><ul class="steps">${st.map((s,i)=>`<li class="${i<=o.step?'done':''}"><span class="d"></span><span>${s}</span><span class="t">${i<=o.step?["12:56","12:57","1:01","1:02","1:07"][i]:""}</span></li>`).join("")}</ul>
      ${o.step===4?`<div class="banner g"><span class="big">Delivered at 1:07</span>Something off? Report it here and we'll sort it.</div><button class="btn o ring" data-issue="${o.id}"><span class="newtag">NEW</span>Report a problem with this order</button>`:""}
      </div></div><div class="sticky">${o.step<4?`<button class="btn g full" id="next">Next update</button>`:`<button class="btn g full" data-go="orders">See all orders</button>`}</div>`},

    orders(){return `${sb(true)}<div class="topline"><b style="font-size:20px">Your orders</b></div>
      <div class="scroll"><div class="sec">
      ${S.orders.map(o=>`<div class="card">
        <div style="display:flex;justify-content:space-between"><b>${o.id}</b><span class="muted">${o.when}</span></div>
        <div class="muted">${Object.entries(o.items).map(([k,v])=>v+" × "+item(k).name).join(", ")} · ${rupee(o.total)}</div>
        ${o.late?`<div class="banner y ring" style="border-radius:12px"><span class="newtag">NEW</span><b>Sorry, this one was ${o.late} min late.</b> We've added ₹30 to your wallet.</div>`:`<div class="chips"><span class="chip">On time</span></div>`}
        ${o.fixed?`<div class="banner g">${o.fixed}</div>`:`<button class="btn o sm ${o.late?'':'ring'}" data-issue="${o.id}" style="align-self:flex-start">${o.late?'':'<span class="newtag">NEW</span>'}Report a problem</button>`}
      </div>`).join("")}
      </div></div>${tabbar("orders")}`},

    issue(){const o=S.orders.find(x=>x.id===S.issueOrder)||S.orders[0]; const I=S.issue;
      const types=[["late","It came late"],["missing","Something was missing"],["quality","The food wasn't good"],["wrong","I got the wrong item"]];
      if(I.done){const amt=I.amount;return `${sb(true)}<div class="topline"><button class="back" data-go="orders" aria-label="Back">‹</button><b>Order ${o.id}</b></div>
        <div class="scroll"><div class="sec"><div class="banner g ring"><span class="newtag">NEW</span><span class="big">${I.mode==="wallet"?rupee(amt)+" is in your wallet":rupee(amt)+" refund started"}</span>${I.mode==="wallet"?"Use it on your next order.":"It'll show in your UPI app once your bank processes it."}</div>
        <div class="card"><b>Sorry about that</b><span class="muted">${I.type==="late"?`We're looking into what held up this order.`:`We've told the ${PEOPLE[S.person].kitchen} about your ${item(I.item).name.toLowerCase()}, so they can check it before the next one goes out.`}</span></div>
        </div></div><div class="sticky"><button class="btn g full" data-go="orders">Done</button></div>`;}
      return `${sb(true)}<div class="topline"><button class="back" data-go="orders" aria-label="Back">‹</button><div><b>What went wrong?</b><div class="muted">Order ${o.id} · ${o.when}</div></div></div>
      <div class="scroll"><div class="sec">
        ${types.filter(([k])=>!(k==="late"&&o.late)).map(([k,l])=>`<button class="opt" data-type="${k}" aria-pressed="${I.type===k}">${l}<span>${I.type===k?"✓":""}</span></button>`).join("")}
        ${I.type&&I.type!=="late"?`<b style="margin-top:4px">Which item?</b>${Object.keys(o.items).map(k=>`<button class="opt" data-item="${k}" aria-pressed="${I.item===k}">${item(k).name}<span>${rupee(item(k).price)}</span></button>`).join("")}
          <button class="opt" id="photo" aria-pressed="${!!I.photo}">${I.photo?"Photo added":"Add a photo (optional)"}<span>${I.photo?"✓":"+"}</span></button>`:""}
        ${I.type?`<b style="margin-top:4px">Refund to</b><div style="display:flex;gap:8px"><button class="opt" data-mode="wallet" aria-pressed="${I.mode==="wallet"}">Swish wallet (instant)</button><button class="opt" data-mode="upi" aria-pressed="${I.mode==="upi"}">UPI</button></div>`:""}
      </div></div>
      <div class="sticky"><button class="btn g full" id="submitIssue" ${I.type&&(I.type==="late"||I.item)?"":"disabled"}>Get refund</button><span class="muted" style="text-align:center">Instant on your first 2 claims each month, up to ₹150 each</span></div>`},

    wallet(){return `${sb(true)}<div class="topline"><b style="font-size:20px">Wallet</b></div>
      <div class="scroll"><div class="sec"><div class="card" style="background:var(--mint)"><span class="muted">Balance</span><span class="big" style="font-size:30px">${rupee(S.wallet+30)}</span><span class="muted">Use it on any order, in full.</span></div>
      <div class="card"><b>Recent</b>
      <div class="bill"><div class="r"><span>Late delivery · #4790</span><span class="v">+₹30</span></div>${S.wallet?`<div class="r"><span>Refund · ${S.issueOrder}</span><span class="v">+${rupee(S.wallet)}</span></div>`:""}</div></div>
      </div></div>${tabbar("wallet")}`},

    usual(){const times=["8:30 am","9:00 am","12:30 pm","1:00 pm","8:00 pm"];
      return `${sb(true)}<div class="topline"><button class="back" data-go="home" aria-label="Back">‹</button><b>Weekday reminder</b></div>
      <div class="scroll"><div class="sec">
        <p class="muted" style="margin:0">We'll send you one notification with your usual. Tap it to order. Skip any day you like.</p>
        <b>What time?</b>${times.map(t=>`<button class="opt" data-time="${t}" aria-pressed="${S.usualTime===t}">${t}<span>${S.usualTime===t?"✓":""}</span></button>`).join("")}
        <b>Preview</b><div class="notif"><span class="ic">S</span><span><b>Your usual is ready to order</b><br>Tap to order. It'll be there in about 10 minutes.</span></div>
      </div></div><div class="sticky"><button class="btn g full" id="setUsual">Remind me at ${S.usualTime} on weekdays</button></div>`},

    kitchen(){const rows=[["paneer","Paneer tikka roll",[0,3,0]],["rajma","Rajma chawal bowl",[1,0,0]],["idli","Tofu stuffed idli",[0,1,0]],["chai","Ginger chai",[0,0,0]]];
      const c=v=>`<span class="cell ${v>=3?'h2':v>=1?'h1':''}">${v}</span>`;
      return `<div class="station">${sb()}<div class="st-h"><div><b>Swish Station</b><div class="muted" style="color:#9fb3a7;font-size:12px">HSR kitchen · lunch shift · Meera</div></div><button class="avatar" data-go="who" aria-label="Switch person">ME</button></div>
      <div class="st-card ring"><span class="newtag">NEW</span><b>Complaints today, by dish and shift</b><span class="muted">From customer reports in the app</span>
        <div class="dishrow"><span class="muted">Dish</span><span class="muted" style="text-align:center">Bfast</span><span class="muted" style="text-align:center">Lunch</span><span class="muted" style="text-align:center">Dinner</span></div>
        ${rows.map(r=>`<div class="dishrow"><span>${r[1]}</span>${r[2].map(c).join("")}</div>`).join("")}
      </div>
      ${S.paused.paneer?`<div class="st-card ring" style="border-color:#6b2a22"><span class="newtag">NEW</span><b style="color:#ffb3a6">Paneer tikka roll paused here</b><span class="muted">3 complaints with photos this lunch. It usually gets fewer than 1. Customers said "roll arrived cold" and "filling dry". The rest of the menu is still on.</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm dk" id="checklist">Run the check</button><button class="btn sm g" id="resume">Checked, put it back</button></div></div>`
        :`<div class="st-card"><b>Paneer tikka roll is back on</b><span class="muted">Meera checked it at 12:58.</span></div>`}
      <div style="padding:4px 16px 6px;font-weight:700">On the line now</div>
      ${[["#5102","Rajma chawal bowl ×2"],["#5103","Indori poha, Ginger chai"],["#5104","Tofu stuffed idli"]].map(([id,t])=>`<div class="tkt"><span><b>${id}</b> · ${t}${S.stopped[id]?'<br><span style="color:#ffb3a6">Stopped, remaking</span>':''}</span>${S.stopped[id]?'':`<button class="btn sm stop ring" data-stop="${id}"><span class="newtag">NEW</span>Stop order</button>`}</div>`).join("")}
      </div>`},

    rider(){return `<div class="rider">${sb(true)}<div class="topline"><div><b style="font-size:18px">Swish Delivery Partner</b><div class="muted">Imran · HSR · online</div></div><button class="avatar" data-go="who" aria-label="Switch person" style="margin-left:auto">IM</button></div>
      ${S.riderAccepted?`<div class="banner g" style="margin:12px 14px">Accepted. Pick up from counter 2 at the HSR kitchen. The drop is 0.7 km away.</div>`
      :`<div class="alert ring"><span class="newtag">NEW</span><span class="muted" style="color:#cfe9d7">Keeps ringing until you accept</span><span class="big">New order · 0.7 km</span><span>HSR kitchen · ready in 2 min · ₹38</span><button class="btn" style="background:#fff;color:var(--green-xd)" id="accept">Accept</button></div>`}
      <div class="card ring" style="margin:12px 14px"><span class="newtag">NEW</span><b>Payday: Friday</b><span class="muted">This week: ₹2,940 from 71 orders</span></div>
      <div class="card ring" style="margin:0 14px"><span class="newtag">NEW</span><b>Your shifts tomorrow</b><span class="muted">12 pm to 4 pm · HSR · confirmed</span><span class="muted">7 pm to 11 pm · Koramangala · 3 slots open</span></div>
      </div>`}
  };
  function menuRow(m){const paused=!!S.paused[m.id];
    return `<div class="item"><span class="sq ${m.cls}">${m.tag}</span><span><b><span class="vegdot"></span>${m.name}</b><span class="muted">${rupee(m.price)}</span></span>
    ${paused?`<span class="muted" style="font-size:12px;text-align:right">Unavailable<br>right now</span>`:`<button class="btn o sm" data-add="${m.id}">${S.cart[m.id]?"Added "+S.cart[m.id]:"Add"}</button>`}</div>`}


  /* ---------- routing ---------- */
  function route(){const h=(location.hash||"#who").slice(1);
    let r=h in SCREENS?h:"who";
    if(r!=="who"&&!S.person) r="who";
    if(S.person){const k=PEOPLE[S.person].kind;
      if(k==="kitchen"&&r!=="who") r="kitchen";
      if(k==="rider"&&r!=="who") r="rider";
      if(k==="customer"&&(r==="kitchen"||r==="rider")) r="home";}
    if(r==="track"&&!S.track) r="home";
    S.route=r;
    $("screen").innerHTML=SCREENS[r]()+toast()+`<span class="label-concept">Unofficial concept · not affiliated with Swish</span>`;
    bind();
    if(S.toast){setTimeout(()=>{S.toast="";const t=document.querySelector(".toast");if(t)t.remove();},2600);}
  }
  function go(r){if(location.hash==="#"+r) route(); else location.hash=r;}

  function bind(){
    const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el));
    on("[data-go]",el=>go(el.dataset.go));
    on("[data-person]",el=>{const keep=el.dataset.person; reset(); S.person=keep; const k=PEOPLE[keep].kind; go(k==="customer"?"home":k);});
    on("[data-add]",el=>{S.cart[el.dataset.add]=(S.cart[el.dataset.add]||0)+1;route();});
    on("[data-usual]",el=>{S.cart={};el.dataset.usual.split(",").forEach(k=>S.cart[k]=1);go("cart");});
    const pl=$("place"); if(pl) pl.onclick=()=>{S.track={id:"#5110",step:0};S.cart={};go("track");};
    const nx=$("next"); if(nx) nx.onclick=()=>{S.track.step++;route();};
    on("[data-issue]",el=>{S.issueOrder=el.dataset.issue;S.issue={type:null,item:null,mode:"wallet",done:false};
      if(!S.orders.find(o=>o.id===S.issueOrder)){S.orders.unshift({id:S.issueOrder,when:"Today, 12:56 pm",items:{rajma:1,chai:1},total:188,late:0});}
      go("issue");});
    on("[data-type]",el=>{S.issue.type=el.dataset.type;S.issue.item=el.dataset.type==="late"?Object.keys((S.orders.find(o=>o.id===S.issueOrder)||S.orders[0]).items)[0]:null;route();});
    on("[data-item]",el=>{S.issue.item=el.dataset.item;route();});
    on("[data-mode]",el=>{S.issue.mode=el.dataset.mode;route();});
    const ph=$("photo"); if(ph) ph.onclick=()=>{S.issue.photo=!S.issue.photo;route();};
    const si=$("submitIssue"); if(si) si.onclick=()=>{const o=S.orders.find(x=>x.id===S.issueOrder);
      const amt=S.issue.type==="late"?30:item(S.issue.item).price; S.issue.amount=amt; S.issue.done=true;
      if(S.issue.mode==="wallet") S.wallet+=amt;
      o.fixed=`Refunded ${rupee(amt)} to ${S.issue.mode==="wallet"?"your wallet":"UPI"}`;
      S.toast=`${rupee(amt)} refunded`;route();};
    on("[data-time]",el=>{S.usualTime=el.dataset.time;route();});
    const su=$("setUsual"); if(su) su.onclick=()=>{S.usualSet=true;S.toast=`Done. We'll remind you at ${S.usualTime} on weekdays.`;go("home");};
    const rs=$("resume"); if(rs) rs.onclick=()=>{S.paused.paneer=false;S.toast="Paneer tikka roll is back on the menu.";route();};
    const ck=$("checklist"); if(ck) ck.onclick=()=>{S.toast="Batch time, hold time, wrap: all OK.";route();};
    on("[data-stop]",el=>{S.stopped[el.dataset.stop]=true;S.toast=`${el.dataset.stop} stopped. Remaking it; the rider knows it'll be 3 min late.`;route();});
    const ac=$("accept"); if(ac) ac.onclick=()=>{S.riderAccepted=true;route();};
  }
  window.addEventListener("hashchange",route);


  route();
})();
</script>

</body>
</html>
