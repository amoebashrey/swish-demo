<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swish Concept Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Outfit:wght@800;900&display=swap">
<style>
/* Swish concept prototype. One file; screens are drawn by SCREENS in the script below. */
:root{
  --green:#34c25a; --green-d:#1f9e45; --green-xd:#0f5a2a; --mint:#e8f8ed; --mint-2:#d4f2dd;
  --ink:#1c1c1c; --ink-2:#3b3b3b; --muted:#6f716f; --faint:#9a9c9a; --line:#ececec; --page:#e9ecea; --sbg:#f3f3f5;
  --pink:#fde8f5; --pink-ink:#c2338a; --cream:#fdf6da; --gold:#a8790d; --orange:#f4a01c;
  --red:#d9372b; --red-soft:#fdecea; --amber:#f2a516; --amber-soft:#fff4dc; --ring:#f4c430;
  --sans:"Plus Jakarta Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.4;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 16px 32px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;transition:transform .12s ease,filter .12s ease}
button:active:not(:disabled){transform:scale(.96);filter:brightness(.97)}
button:focus-visible,a:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
img{display:block}
svg{flex:none}

/* page chrome outside the phone */
.topbar{width:414px;max-width:100%;display:flex;gap:8px 16px;align-items:center;justify-content:space-between;padding:0 4px 14px;font-size:12.5px;color:var(--muted)}
.topbar b{color:var(--ink);font-weight:600}
.pill{border:1px solid #d5d9d6;background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}

/* iPhone frame: 390 x 844 screen */
.device{position:relative;width:414px;height:868px;padding:12px;border-radius:66px;background:#141414;box-shadow:inset 0 0 0 1.5px #3a3a3a,inset 0 0 0 5px #0a0a0a,0 40px 80px -20px #0005,0 0 0 1px #000;transform-origin:top center}
.device::before,.device::after{content:"";position:absolute;width:3px;border-radius:2px;background:#2a2a2a}
.device::before{left:-3px;top:180px;height:62px;box-shadow:0 80px 0 #2a2a2a}
.device::after{right:-3px;top:220px;height:96px}
.screen{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#fff;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:20px;background:#000;z-index:80;pointer-events:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:80;pointer-events:none}
.homebar.light{background:#fff}
.label-concept{position:absolute;left:50%;transform:translateX(-50%);bottom:17px;font-size:9px;font-weight:600;color:#8a8d8a;z-index:79;white-space:nowrap;pointer-events:none;letter-spacing:.01em}
.label-concept.light{color:#a7b5ad}
@media (max-width:500px){
  body{padding:0;background:#fff}
  .topbar{display:none}
  .device{width:100vw;height:100vh;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none;zoom:1!important}
  .device::before,.device::after{display:none}
  .screen{width:100%;height:100%;border-radius:0}
}

/* views and transitions */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.view.grey{background:var(--sbg)}
.view.dark{background:#0f1512;color:#eaf2ec}
@media (prefers-reduced-motion:no-preference){
  .view.in{animation:vin .26s cubic-bezier(.2,.8,.2,1)}
  .view.in-back{animation:vback .26s cubic-bezier(.2,.8,.2,1)}
  .view.out{animation:vout .2s ease forwards}
  @keyframes vin{from{transform:translateX(36px);opacity:0}}
  @keyframes vback{from{transform:translateX(-36px);opacity:0}}
  @keyframes vout{to{opacity:0}}
}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.hscroll{overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}

/* status bar */
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 46px;font-weight:700;font-size:16.5px;letter-spacing:-.01em;color:var(--ink);z-index:70;pointer-events:none}
.sb.light{color:#fff}
.sb .ic{display:flex;gap:6px;align-items:center}
.pt{padding-top:54px}
.sbbg{position:absolute;top:0;left:0;right:0;height:54px;z-index:65;opacity:0;transition:opacity .2s;pointer-events:none}
.scrolled .sbbg{opacity:1}
.scrolled .sb.flip{color:var(--ink)}

/* shared atoms */
.veg{width:18px;height:18px;border:1.6px solid #1a9a46;border-radius:4px;display:inline-grid;place-items:center;background:#fff;flex:none}
.veg::after{content:"";width:8px;height:8px;border-radius:50%;background:#1a9a46}
.veg.nv{border-color:var(--red)}
.veg.nv::after{border-radius:0;width:0;height:0;background:none;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--red)}
.qchip{display:inline-block;font-size:12.5px;font-weight:600;color:#666;background:#f6f6f6;border:1px solid #dedede;border-radius:6px;padding:2px 8px}
.add{background:#fff;border:1.5px solid var(--green);color:var(--green-d);font-weight:800;font-size:16px;border-radius:12px;padding:7px 0;width:100px;box-shadow:0 4px 12px #0000001a;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.step{display:inline-grid;grid-template-columns:32px 1fr 32px;align-items:center;background:var(--green);color:#fff;border-radius:12px;width:100px;height:38px;font-weight:800;font-size:16px;box-shadow:0 4px 12px #0000001a;overflow:hidden}
.step button{height:100%;display:grid;place-items:center;color:#fff}
.step span{text-align:center}
.step.ol{background:#f1fbf4;border:1.5px solid var(--green);color:var(--green-d);height:34px;width:92px;box-shadow:none}
.step.ol button{color:var(--green-d)}
.btn{border-radius:14px;padding:15px 18px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.g{background:var(--green);color:#fff}
.btn.o{background:#fff;border:1.5px solid var(--green);color:var(--green-d)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{width:40px;height:40px;border-radius:50%;background:#f1f1f3;display:grid;place-items:center;color:var(--ink)}
.back.glass{background:#0000003d;color:#fff;backdrop-filter:blur(6px)}
.h1{font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.15}
.h2{font-weight:800;font-size:20px;letter-spacing:-.015em;margin:0}
.h3{font-weight:800;font-size:17px;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:14px}
.card{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.bd{border:1px solid var(--line)}
.sec{padding:16px;display:flex;flex-direction:column;gap:14px}
.topline{display:flex;gap:12px;align-items:center;padding:8px 16px 12px}
.topline .eta{font-weight:800;color:var(--green-d);font-size:22px;letter-spacing:-.015em;line-height:1.1}
.topline .addr{font-size:14px;color:#555;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;max-width:290px}
.addr .tx{overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--mint);color:var(--green-xd);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.amber{background:var(--amber-soft);color:#8a5a00} .chip.grey{background:#f0f0f0;color:#666}
.banner{border-radius:16px;padding:13px 15px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.banner.g{background:var(--mint);color:var(--green-xd)} .banner.r{background:var(--red-soft)} .banner.y{background:var(--amber-soft);color:#6b4700}
.big{font-weight:800;font-size:20px;letter-spacing:-.015em}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff;width:100%;text-align:left;font-size:15px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--mint)}
.opt .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid #cfd3d0;display:grid;place-items:center;color:#fff;flex:none}
.opt[aria-pressed="true"] .tick{background:var(--green);border-color:var(--green)}
.footer{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 16px 38px;box-shadow:0 -6px 20px #0000000f;display:flex;flex-direction:column;gap:8px;z-index:30}
.footer .note{text-align:center;font-size:12.5px;color:var(--muted)}
.toast{position:absolute;left:14px;right:14px;top:58px;background:#1c1c1c;color:#fff;border-radius:16px;padding:13px 16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px #0004;z-index:75;display:flex;gap:10px;align-items:center}
@media (prefers-reduced-motion:no-preference){.toast,.push{animation:drop .35s cubic-bezier(.2,.9,.3,1.2)}@keyframes drop{from{transform:translateY(-24px);opacity:0}}}

/* iOS-style notification */
.push{position:absolute;left:10px;right:10px;top:54px;z-index:76;background:#f6f6f6eb;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;padding:12px 14px;display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:center;box-shadow:0 10px 40px #0003;text-align:left;width:auto}
.push .app{width:38px;height:38px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff}
.push .meta{display:flex;justify-content:space-between;font-size:12.5px;color:#777;font-weight:600}
.push b{display:block;font-size:14.5px}
.push p{margin:1px 0 0;font-size:14px;color:#333}

/* NEW marker for concept features */
.nw{position:relative;outline:1.5px solid var(--ring);outline-offset:3px}
.ntag{position:absolute;top:-12px;left:14px;z-index:3;background:var(--ring);color:#3a2c00;font-size:9.5px;font-weight:800;letter-spacing:.07em;line-height:1;padding:4px 7px 4px;border-radius:6px;white-space:nowrap;pointer-events:none}
.ntag i{font-style:normal;font-weight:700;letter-spacing:.01em}
.ntag.side{top:50%;left:calc(100% + 10px);transform:translateY(-50%)}
.newchip{display:inline-block;margin-left:8px;background:var(--ring);color:#3a2c00;font-size:9.5px;font-weight:800;letter-spacing:.07em;padding:3px 6px;border-radius:6px;vertical-align:2px}
.nonew .newchip{display:none}
.ntag{background:linear-gradient(105deg,var(--ring) 38%,#fff6c4 50%,var(--ring) 62%) 100% 0/300% 100%}
@media (prefers-reduced-motion:no-preference){
  .nw{animation:nwglow 2.4s ease-in-out infinite}
  .ntag{animation:nwshine 3s linear infinite}
  @keyframes nwglow{0%,100%{outline-color:var(--ring);box-shadow:0 0 0 0 #f4c43000}50%{outline-color:#ffd84a;box-shadow:0 0 16px 3px #f4c43059}}
  @keyframes nwshine{0%,40%{background-position:100% 0}100%{background-position:0 0}}
}
.nonew .nw{outline:0;animation:none;box-shadow:none}
.nonew .ntag{display:none}

/* ---------- home ---------- */
.hdr{position:relative;background-color:#37c45c;color:#fff;padding:54px 16px 0;overflow:hidden}
.hdr::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
   radial-gradient(circle at 12% 18%,#ffffff1c 0 34px,transparent 35px),
   radial-gradient(circle at 48% 6%,#ffffff17 0 46px,transparent 47px),
   radial-gradient(circle at 84% 22%,#ffffff17 0 38px,transparent 39px),
   radial-gradient(circle at 30% 42%,#ffffff12 0 30px,transparent 31px),
   radial-gradient(circle at 70% 46%,#ffffff12 0 40px,transparent 41px),
   radial-gradient(circle at 96% 60%,#ffffff12 0 30px,transparent 31px)}
.hdr>*{position:relative}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:6px}
.eta10{font-weight:800;font-size:31px;letter-spacing:-.025em;line-height:1.05}
.haddr{display:flex;align-items:center;gap:6px;font-size:15.5px;font-weight:500;margin-top:4px;white-space:nowrap;min-width:0}
.haddr .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.haddr b{font-weight:700}
.earn{display:flex;align-items:center;gap:4px;background:linear-gradient(90deg,#f0fff4,#c9f2d6);border-radius:999px;padding:3px 4px 3px 12px;color:var(--green-xd);height:44px}
.earn b{font-size:12.5px;line-height:1.05;font-weight:800;text-align:left}
.earn img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.earn .chev{width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.me{width:46px;height:46px;border-radius:50%;background:#1f8f43;display:grid;place-items:center;color:#fff}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;margin-top:16px}
.search{min-width:0;background:#fff;border-radius:16px;height:54px;padding:0 6px 0 14px;display:flex;align-items:center;gap:10px;color:#8b8b8b;font-size:16px;box-shadow:0 2px 0 #00000010}
.search .q{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.vegt{display:flex;align-items:center;gap:6px;border:1px solid #e3e3e3;border-radius:10px;padding:7px 8px;color:#555;font-weight:800;font-style:italic;font-size:13px}
.sw{width:34px;height:18px;border-radius:9px;background:#e1e1e1;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:left .2s}
.sw.on{background:var(--green)}
.sw.on::after{left:18px}
.newon{border-radius:16px;background:linear-gradient(135deg,#fffbe6,#fdf0b8);position:relative;overflow:hidden;color:var(--green-xd);text-align:left;padding:8px 10px;font-size:11px;font-weight:800;line-height:1.08;letter-spacing:.02em;display:flex;flex-direction:column;justify-content:flex-end}
.newon i{font-style:italic;font-size:12px}
.newon img{position:absolute;right:7px;top:7px;width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #fff,0 2px 6px #0002}
.offerhero{position:relative;height:236px;margin:0 -16px;display:grid;place-items:start center;padding-top:18px}
.offerhero::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 46%,#ffffff22 0 5deg,transparent 5deg 17deg);-webkit-mask:radial-gradient(ellipse 70% 80% at 50% 46%,#000 30%,transparent 75%);mask:radial-gradient(ellipse 70% 80% at 50% 46%,#000 30%,transparent 75%)}
.offerhero::after{content:"";position:absolute;left:-30%;right:-30%;bottom:-120px;height:190px;background:#fff;border-radius:50%}
.ticket{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.t50,.tun{font-family:"Outfit",var(--sans);font-weight:900;paint-order:stroke fill;-webkit-text-stroke:5px #262626}
.t50{position:relative;z-index:0;font-size:54px;line-height:.95;letter-spacing:-.01em;-webkit-text-stroke:0}
.t50 .f{background:linear-gradient(180deg,#fff57a 0%,#ffd21c 50%,#f7a10a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.t50::before{content:attr(data-t);position:absolute;inset:0;z-index:-1;color:#262626;-webkit-text-stroke:5px #262626;text-shadow:0 4px 0 #262626}
.tun{position:relative;font-size:58px;line-height:1;letter-spacing:-.01em;color:#fff;text-shadow:0 4px 0 #262626;display:flex;align-items:center;margin-top:-2px}
.tun .lk{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;border:4px solid #262626;margin:0 2px;color:#262626;box-shadow:0 4px 0 #262626}
.tfree{margin-top:8px;color:#fff;font-size:13px;font-weight:800;letter-spacing:.08em;text-shadow:0 1px 2px #0003}
.tcode{margin-top:10px;background:#fff;border:2px solid #262626;border-radius:999px;padding:8px 30px;font-size:14.5px;font-weight:700;color:#222;position:relative;z-index:3;box-shadow:0 3px 0 #262626}
.spark{position:absolute;color:#fff;opacity:.9;z-index:1}
.coffee250{position:relative;border-radius:18px;background:linear-gradient(100deg,#fdf6d8 0%,#fbefc4 100%);border:1px solid #f3e6b4;padding:16px 120px 16px 18px;overflow:hidden;text-align:left;width:100%}
.coffee250 .t{font-weight:800;font-size:19px;color:var(--gold);letter-spacing:-.01em;line-height:1.15}
.coffee250 .t i{font-style:italic;display:block}
.coffee250 .s{font-size:14px;color:#333;margin-top:6px;font-weight:500}
.coffee250 img{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 6px 16px #a8790d33}
.cats{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:82px;gap:20px 10px;padding:4px 16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13.5px;color:#4a4a4a;text-align:center;line-height:1.2;font-weight:500}
.cat img{width:76px;height:76px;border-radius:50%;object-fit:cover;box-shadow:0 6px 14px #0000001f}
.colls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.coll{border-radius:14px;height:108px;position:relative;overflow:hidden;text-align:left;padding:9px 8px;font-size:12px;font-weight:800;letter-spacing:-.01em;line-height:1.1;display:flex;flex-direction:column;justify-content:flex-start}
.coll img{position:absolute;left:8px;right:8px;bottom:-12px;width:calc(100% - 16px);height:56px;object-fit:cover;border-radius:12px 12px 0 0;z-index:0}
.coll>span.ct{position:relative;z-index:1}
.coll.gm{background:linear-gradient(160deg,#127a3a,#0b4a22);color:#fff;font-size:18px;font-weight:700;letter-spacing:-.03em}
.coll.fa{background:linear-gradient(180deg,#f6ecfd,#e9d8fb);color:#7a3db5}
.coll.bs{background:linear-gradient(180deg,#eefaf1,#d9f3e1);color:#1f7a3a}
.coll.u99{background:linear-gradient(180deg,#fffaea,#fbefc9);color:#a8790d}
.coll .cloche{position:absolute;left:50%;bottom:6px;transform:translateX(-50%)}
.refer{position:relative;border-radius:18px;background:linear-gradient(90deg,#f1fbf4,#dff5e6);padding:16px 16px 16px 76px;overflow:hidden;text-align:left;width:100%}
.refer img{position:absolute;left:10px;bottom:-6px;width:56px;height:80px;object-fit:cover;border-radius:12px}
.refer .t{font-weight:800;font-style:italic;color:var(--green-xd);font-size:17px;line-height:1.15}
.refer .s{font-size:13px;color:#4a6a55;margin-top:2px}
.refer .amt{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-weight:800;font-size:38px;color:#3cb860;letter-spacing:-.03em}
.rowhead{display:flex;justify-content:space-between;align-items:baseline}
.offerbar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:#e9f8ee;border-radius:22px 22px 0 0;padding:16px 20px 42px;display:flex;align-items:center;gap:14px;box-shadow:0 -8px 24px #0000000d}
.offerbar b{display:block;color:#1f9e45;font-size:17px;font-weight:700}
.offerbar span{color:#1f9e45;font-size:14px;font-weight:600;letter-spacing:.02em}
.cartbar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 24px #00000014;overflow:hidden;padding-bottom:36px}
.cartbar .note{background:#e9f8ee;color:#1f9e45;font-size:13.5px;font-weight:700;padding:9px 16px;display:flex;gap:8px;align-items:center}
.cartbar .go{margin:10px 16px 0;width:calc(100% - 32px);background:var(--green);color:#fff;border-radius:14px;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}
.cartbar .go small{display:block;font-size:12px;font-weight:600;opacity:.9;text-align:left}

/* dish grid (menu, home picks) */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px}
.dc{display:flex;flex-direction:column;gap:6px;min-width:0}
.dc .ph{position:relative;aspect-ratio:1/1;border-radius:20px;background:#f2f2f2}
.dc .ph>button.open{display:block;width:100%;height:100%;border-radius:20px;overflow:hidden}
.dc .ph img{width:100%;height:100%;object-fit:cover}

        ${q?`<div class="deal"><div class="row"><span class="ok">${I.check}</span>${b.ok?'You unlocked a sweet deal! 50% upto ₹150 Off':`Add ${rupee(b.short)} more to unlock 50% off`}</div><div class="prog"><i style="width:${b.ok?100:Math.round(b.t/99*100)}%"></i></div></div>`:''}
        <div class="acts ${q?'':'one'}">${q?`<button class="cartbtn" data-go="cart">${I.cart} Cart · ${cartCount()}</button><span class="bigstep"><button data-sub="${m.id}" aria-label="Remove one">${q===1?I.trash:I.minus}</button><span>${q}</span><button data-add="${m.id}" aria-label="Add one">${I.plus}</button></span>`

    cart(){const p=PEOPLE[S.person]; const b=bill(); const n=cartCount();
      const like=["gulab","chai","coldcoffee","brownie"].filter(k=>!S.cart[k]).slice(0,3).map(item);
      if(!n) return {cls:"grey",html:`${sb()}<div class="pt"></div><div class="topline"><button class="back" data-back="prev" aria-label="Back" style="background:#fff">${I.back}</button><div style="min-width:0"><div class="eta">Arrives by 1:12 pm</div><div class="addr">${addrLine(p)}</div></div></div>
        <div class="scroll"><div class="sec" style="align-items:center;text-align:center;padding-top:80px"><div style="width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#c4c4c4"><span style="transform:scale(2);display:flex">${I.cart}</span></div>
        <h2 class="h2">Your cart is empty</h2><span class="muted">Add something from the menu to get started.</span><button class="btn g" data-cat="all" style="margin-top:8px">Browse menu</button></div></div>`};

        <div class="scroll" style="padding-bottom:120px"><div class="sec">
          <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="h3" style="font-size:18px">${n} item${n>1?'s':''}</span><button id="clear" style="text-decoration:underline;color:#555;font-size:14px;font-weight:600">Clear</button></div>
            ${Object.entries(S.cart).map(([k,v])=>`<div class="citem"><img src="${item(k).img}" alt=""><span class="nm">${item(k).name}</span><span class="pr">${rupee(item(k).price*v)}</span>${stepper(k,'ol')}</div>`).join("")}</div>
          ${like.length?`<div class="card"><span class="h3" style="font-size:17px">You might also like this</span><div class="also hscroll" style="padding:0;grid-auto-columns:120px">${like.map(x=>miniCard(x)).join("")}</div></div>`:''}
          ${S.coupon?`<div class="coupon"><div class="hd">${b.ok?'Best offer applied!':'Almost there'}</div><div class="bd"><span class="ck">${I.check}</span><span><b>${b.ok?`You saved ${rupee(b.disc)} with 'TRY50'`:`Add ${rupee(b.short)} more for TRY50`}</b><span class="vl">View all coupons ${I.chev}</span></span><button class="rm" id="coupon">Remove</button></div></div>`
            :`<div class="coupon off"><div class="bd"><span class="ck" style="background:#cfd3d0">%</span><span><b>TRY50</b><span class="vl">50% off up to ₹150, free delivery</span></span><button class="rm" id="coupon">Apply</button></div></div>`}
          <div class="bill">
            <div class="r"><span>Item total</span><span class="v">${rupee(b.t)}</span></div>
            ${b.disc?`<div class="r"><span>Discount</span><span class="v gr">${rupee(b.disc)}</span></div>`:''}
            <div class="r"><span>Delivery fee</span><span class="v ${b.deliv?'':'gr'}">${b.deliv?rupee(29):'<s>₹29</s>FREE'}</span></div>
            <div class="r"><span>Packaging fee</span><span class="v ${b.pack?'':'gr'}">${b.pack?rupee(9):'<s>₹9</s>FREE'}</span></div>
            <div class="r"><span style="display:flex;align-items:center;gap:6px">Tax <span style="width:16px;height:16px;border:1.5px solid #999;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#999">i</span></span><span class="v">${rupee(b.tax)}</span></div>
            <div class="r tot"><span style="color:var(--ink)">To Pay</span><span class="v ${b.saved?'gr':''}" style="font-size:19px">${b.saved?`<s>${rupee(b.t)}</s>`:''}${rupee(b.pay)}</span></div>
          </div>
          ${b.saved?`<button class="savedrow" id="savedrow"><span class="top"><span style="display:flex;gap:6px;align-items:center">${I.spark} You saved ${rupee(b.saved)} on this order</span><span style="display:inline-flex;transform:rotate(${S.savedOpen?180:0}deg)">${I.down}</span></span>
            ${S.savedOpen?`<span class="r"><span>TRY50 discount</span><span>${rupee(b.disc)}</span></span><span class="r"><span>Free delivery</span><span>₹29</span></span><span class="r"><span>Free packaging</span><span>₹9</span></span>`:''}</button>`:''}
          <div class="terms"><b>Terms & Conditions</b><ul><li>Orders cannot be cancelled once preparation begins. A refund will be provided in case of unexpected delays, if applicable.</li><li>Coupons can only be applied on Swish Food & Beverages.</li></ul></div>
        </div></div>
        <div class="footer"><button class="btn g full" id="place" style="height:58px;font-size:19px">Pay ${rupee(b.pay)}</button></div>`}},

    track(){const o=S.track; const st=["Order received","Cooking","Packed","Rider on the way","Delivered"];
      const times=o.slip?["1:00","1:01","1:09","1:10","1:15"]:["1:00","1:01","1:05","1:06","1:11"];
      const done=o.step>=4;
      return {html:`${sb()}<div class="pt"></div><div class="topline"><button class="back" data-back="home" aria-label="Back">${I.back}</button><div style="min-width:0;flex:1"><b style="font-size:18px">Order ${o.id}</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${PEOPLE[S.person].kitchen} · ${Object.entries(o.items).map(([k,v])=>v+" × "+item(k).name).join(", ")}</div></div></div>
      <div class="scroll" style="padding-bottom:120px"><div class="sec" style="padding-top:4px">
        ${done?`<div class="etacard"><span class="lbl">Delivered</span><span class="tm">at ${times[4]} pm</span></div>`
          :o.slip?`<div class="etacard slip nw">${nw("honest delays")}<span class="lbl">Running late · was 1:12 pm</span><span class="tm">New time 1:15 pm</span><span style="font-weight:600">Lunch rush, your food is being packed.</span></div>`
          :`<div class="etacard"><span class="lbl">Arriving by</span><span class="tm">1:12 pm</span><span style="font-weight:600;opacity:.95">${["We've got your order.","Your food is being cooked.","Packed and waiting for the rider.","Imran is on the way."][o.step]}</span></div>`}
        <div class="card bd"><ul class="steps">${st.map((s,i)=>`<li class="${i<=o.step?'done':''} ${i===o.step&&!done?'now':''}"><span class="d"></span><span>${s}</span><span class="t">${i<=o.step?times[i]+" pm":""}</span></li>`).join("")}</ul></div>
        ${o.step>=3&&!done?`<div class="card bd"><div class="rider-row"><span class="av">IM</span><span><b>Imran</b><div class="muted">Your delivery partner</div></span><button class="callbtn" id="callRider" aria-label="Call rider">${I.phone}</button></div></div>`:''}
        ${done?`<div class="banner g"><b style="font-size:16px">Enjoy your food</b><span>Something off? Report it here and we'll sort it.</span></div><button class="btn o nw" data-issue="${o.id}">${nw("one-tap report")}Report a problem with this order</button>`:''}
      </div></div>
      <div class="footer">${!done?`<button class="btn g full" id="next">Next update</button>`:`<button class="btn g full" data-go="home">Back to home</button>`}</div>`}},

    orders(){return {cls:"grey",html:`${sb()}<div class="pt" style="background:#fff"></div><div class="topline" style="background:#fff"><button class="back" data-back="prev" aria-label="Back">${I.back}</button><b style="font-size:21px">Your orders</b></div>

      ${S.orders.map(o=>`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">${o.id}</b><span class="muted">${o.when}</span></div>
        <div style="display:flex;gap:10px;align-items:center">${Object.keys(o.items).map(k=>`<img src="${item(k).img}" alt="" style="width:40px;height:40px;border-radius:10px;object-fit:cover">`).join("")}<span class="muted">${Object.entries(o.items).map(([k,v])=>v+" × "+item(k).name).join(", ")} · ${rupee(o.total)}</span></div>

        ${o.fixed?`<div class="banner g">${o.fixed}</div>`:`<button class="btn o sm ${o.late?'':'nw'}" data-issue="${o.id}" style="align-self:flex-start">${o.late?'':nw("one-tap report")}Report a problem</button>`}
      </div>`).join("")}
      </div></div>`}},

    issue(){const o=S.orders.find(x=>x.id===S.issueOrder)||S.orders[0]; const I2=S.issue;
      const types=[["late","It came late"],["missing","Something was missing"],["quality","The food wasn't good"],["wrong","I got the wrong item"],["safety","Something in my food"]];
      if(I2.done){
        if(I2.type==="safety") return {html:`${sb()}<div class="pt"></div><div class="topline"><button class="back" data-back="prev" aria-label="Back">${I.back}</button><b style="font-size:18px">Order ${o.id}</b></div>
          <div class="scroll"><div class="sec"><div class="banner g nw" style="align-items:flex-start;gap:8px">${nw("safety first")}<span class="callbtn" style="background:#fff">${I.phone}</span><span class="big">A person will call you within 30 minutes</span><span>On the number you use for Swish.</span></div>
          <div class="card bd"><b>While you wait</b><span class="muted">Please keep the food and the packaging. We've asked the ${PEOPLE[S.person].kitchen} to hold this batch of ${item(I2.item).name.toLowerCase()} until we've checked it.</span></div>
          </div></div><div class="footer"><button class="btn g full" data-go="orders">Done</button></div>`};
        const amt=I2.amount;return {html:`${sb()}<div class="pt"></div><div class="topline"><button class="back" data-back="prev" aria-label="Back">${I.back}</button><b style="font-size:18px">Order ${o.id}</b></div>
        <div class="scroll"><div class="sec"><div class="banner g nw">${nw("instant refund")}<span class="big">${I2.mode==="wallet"?rupee(amt)+" is in your wallet":rupee(amt)+" refund started"}</span><span>${I2.mode==="wallet"?"Use it on your next order.":"It'll show in your UPI app once your bank processes it."}</span></div>
        <div class="card bd"><b>Sorry about that</b><span class="muted">${I2.type==="late"?`We're looking into what held up this order.`:`We've told the ${PEOPLE[S.person].kitchen} about your ${item(I2.item).name.toLowerCase()}, so they can check it before the next one goes out.`}</span></div>
        </div></div><div class="footer"><button class="btn g full" data-go="orders">Done</button></div>`};}
      const safety=I2.type==="safety";
      return {html:`${sb()}<div class="pt"></div><div class="topline"><button class="back" data-back="prev" aria-label="Back">${I.back}</button><div><b style="font-size:18px">What went wrong?</b><div class="muted">Order ${o.id} · ${o.when}</div></div></div>
      <div class="scroll" style="padding-bottom:150px"><div class="sec nw" style="margin:14px 16px;padding:14px 0 0;border-radius:6px">${nw("one-tap report")}
        ${types.filter(([k])=>!(k==="late"&&o.late)).map(([k,l])=>`<button class="opt" data-type="${k}" aria-pressed="${I2.type===k}">${l}<span class="tick">${I2.type===k?I.check:''}</span></button>`).join("")}
        ${I2.type&&I2.type!=="late"?`<b style="margin-top:6px;font-size:16px">Which item?</b>${Object.keys(o.items).map(k=>`<button class="opt" data-item="${k}" aria-pressed="${I2.item===k}"><span style="display:flex;gap:10px;align-items:center"><img src="${item(k).img}" alt="" style="width:36px;height:36px;border-radius:8px;object-fit:cover">${item(k).name}</span><span>${rupee(item(k).price)}</span></button>`).join("")}
          <button class="opt" id="photo" aria-pressed="${!!I2.photo}">${I2.photo?"Photo added":safety?"Add a photo (helps us check)":"Add a photo (optional)"}<span class="tick">${I2.photo?I.check:''}</span></button>`:""}
        ${safety?`<div class="banner y"><b>We'll call you about this one</b><span>Food safety reports go to a person, not an automatic refund.</span></div>`:''}
        ${I2.type&&!safety?`<b style="margin-top:6px;font-size:16px">Refund to</b><div style="display:flex;gap:8px"><button class="opt" data-mode="wallet" aria-pressed="${I2.mode==="wallet"}">Swish wallet<br>(instant)</button><button class="opt" data-mode="upi" aria-pressed="${I2.mode==="upi"}">UPI</button></div>`:""}
      </div></div>
      <div class="footer"><button class="btn g full" id="submitIssue" ${I2.type&&(I2.type==="late"||I2.item)?"":"disabled"}>${safety?"Request a call":"Get refund"}</button><span class="note">${safety?"A person will call you within 30 minutes":"Instant on your first 2 claims each month, up to ₹150 each"}</span></div>`}},

    wallet(){return {cls:"grey",html:`${sb()}<div class="pt" style="background:#fff"></div><div class="topline" style="background:#fff"><button class="back" data-back="prev" aria-label="Back">${I.back}</button><b style="font-size:21px">Swish Wallet</b></div>

      <div class="scroll" style="padding-bottom:120px"><div class="sec">

      ${line.map(o=>`<div class="tkt ${o.over&&!S.stopped[o.id]?'over':''} ${o===line[0]?'nw':''}" ${o===line[0]?'style="margin-top:6px"':''}>${o===line[0]?nw("rider timing"):''}
        <div class="top"><span><b>${o.id}</b> · ${o.t}</span>${o.over&&!S.stopped[o.id]?`<span class="tag am">${o.over} min over</span>`:''}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          ${S.stopped[o.id]?'<span class="tag" style="background:var(--red-soft);color:var(--red)">Stopped, remaking</span>':o.packed?`<span class="tag am">Packed · waiting ${o.packed} min for rider</span>`:`<span class="tag ${o.state||''}">${o.rider}</span>`}
          ${S.stopped[o.id]?'':`<button class="btn sm stop" data-stop="${o.id}">Stop order</button>`}</div></div>`).join("")}
      </div>`}},

    rider(){return {html:`${sb()}<div class="pt"></div><div class="topline"><div><b style="font-size:19px">Swish Delivery Partner</b><div class="muted">Imran · HSR · online</div></div><button class="me" data-go="who" aria-label="Switch person" style="margin-left:auto;width:42px;height:42px">${I.user}</button></div>
      <div class="scroll" style="padding-bottom:40px">
      ${S.riderAccepted?`<div class="banner g" style="margin:12px 16px">Accepted. Pick up from counter 2 at the HSR kitchen. The drop is 0.7 km away.</div>`
      :`<div class="alert nw">${nw("keeps ringing")}<span style="color:#cfe9d7;font-size:14px">Keeps ringing until you accept</span><span class="big">New order · 0.7 km</span><span>HSR kitchen · ready in 2 min · ₹38</span><button class="btn" style="background:#fff;color:var(--green-xd)" id="accept">Accept</button></div>`}
      <div class="card bd nw" style="margin:22px 16px 0">${nw("payday")}<b>Payday: Friday</b><span class="muted">This week: ₹2,940 from 71 orders</span></div>
      <div class="card bd nw" style="margin:24px 16px 0">${nw("shifts")}<b>Your shifts tomorrow</b><span class="muted">12 pm to 4 pm · HSR · confirmed</span><span class="muted">7 pm to 11 pm · Koramangala · 3 slots open</span></div>
      </div>`}}
  };

  function feedbackCard(){const f=S.feedback; const o=S.orders.find(x=>x.id===f.order); if(!o) return "";
    const ks=Object.keys(o.items); const all=ks.every(k=>S.rated[k]);
    if(all) return `<div class="banner g nw">${nw("rate each dish")}<b>Thanks, noted.</b><span>It helps the kitchen get your next one right.</span></div>`;
    return `<div class="card bd nw">${nw("rate each dish")}<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-size:17px">How was your ${item(ks[0]).short}?</b><span class="muted" style="font-size:12.5px;white-space:nowrap">Order ${o.id}</span></div>
      ${ks.map(k=>`<div class="fbrow"><img src="${item(k).img}" alt=""><span style="font-weight:600">${item(k).name}</span><span class="thumbs"><button data-rate="${k}" data-v="up" aria-label="Good" aria-pressed="${S.rated[k]==='up'}">${I.up}</button><button data-rate="${k}" data-v="down" aria-label="Not good" aria-pressed="${S.rated[k]==='down'}">${I.dn}</button></span></div>`).join("")}</div>`}
  function accountSheet(){const p=PEOPLE[S.person];
    return `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Account"><span class="grab"></span>
      <div style="display:flex;gap:12px;align-items:center;padding:4px 4px 10px"><span class="me" style="background:${p.color}">${p.init}</span><span><b style="font-size:18px">${p.name}</b><div class="muted">${p.addr}</div></span></div>
      <button class="srowbtn" data-go="orders">Your orders <span style="color:#bbb">${I.chev}</span></button>
      <button class="srowbtn" data-go="wallet"><span>Swish Wallet<span class="newchip">NEW</span></span> <span style="display:flex;gap:6px;align-items:center;color:#1fae4b">${rupee(S.wallet+30)} <span style="color:#bbb">${I.chev}</span></span></button>
      <button class="srowbtn" data-go="usual"><span>Weekday reminder<span class="newchip">NEW</span></span> <span style="color:#bbb">${I.chev}</span></button>
      <button class="srowbtn" data-go="who">Switch person <span style="color:#bbb">${I.chev}</span></button>
    </div></div>`}

  /* ---------- routing ---------- */
  const DEFAULT_PERSON={kitchen:"meera",rider:"imran"};
  let cur=null;      // route currently on screen
  let dir="fwd";     // direction of the next transition
  function parseHash(){const h=(location.hash||"#who").slice(1); const [r,qs]=h.split("?");
    return {r:r||"who",q:Object.fromEntries(new URLSearchParams(qs||""))};}

  // URL parameters set up a state directly, so each one can be recorded without clicking through.
  // A link with parameters always starts from a clean state, so it shows the same thing every time.
  function applyParams(r,q){
    if(Object.keys(q).length){const keep=S.person; reset(); S.person=PEOPLE[q.person]?q.person:keep;
      if(S.person&&r in DEFAULT_PERSON&&PEOPLE[S.person].kind!==r) S.person=DEFAULT_PERSON[r];
      if(S.person&&!(r in DEFAULT_PERSON)&&r!=="who"&&PEOPLE[S.person].kind!=="customer") S.person="ananya";}
    if(!S.person&&r!=="who"&&r in SCREENS) S.person=DEFAULT_PERSON[r]||"ananya";
    const on=k=>q[k]==="1", has=k=>k in q;
    if(has("busy")) S.busy=on("busy");
    if(has("closed")){S.closed=on("closed"); if(S.closed) S.busy=true;}
    if(has("cart")){S.cart={}; q.cart.split(",").filter(Boolean).forEach(x=>{const [k,n]=x.split(":"); if(item(k)) S.cart[k]=(+n||1);});}
    if(has("coupon")) S.coupon=q.coupon!=="0";
    if(has("cat")) S.cat=q.cat;
    if(has("veg")) S.vf=q.veg==="1"?"veg":null;
    if(r==="dish"){if(q.id&&item(q.id)) S.dish=q.id; if(on("added")&&!S.cart[S.dish]) S.cart[S.dish]=1; if(on("details")) S.details=true;}
    if(on("sheet")) S.sheet=true;
    if(on("feedback")) ensureDelivered(true);
    if(r==="track"&&(has("step")||has("slip")||!S.track)){
      const slip=on("slip"); const step=has("step")?Math.max(0,Math.min(4,+q.step||0)):slip?2:0;
      S.track={id:"#5110",step,slip:slip&&step>=2,items:S.track?S.track.items:{rajma:1,chai:1}};
      if(slip&&step<4) S.push={title:"New time 1:15",body:"Lunch rush, your food is being packed."};
      if(step>=4) ensureDelivered(false);}
    if(r==="issue"){
      if(q.order){const id="#"+q.order.replace("#",""); if(!S.orders.find(o=>o.id===id)) ensureDelivered(false); S.issueOrder=S.orders.find(o=>o.id===id)?id:S.orders[0].id;}
      if(!S.issueOrder) S.issueOrder=S.orders[0].id;
      if(q.type){const o=S.orders.find(x=>x.id===S.issueOrder); S.issue={type:q.type,item:q.item||Object.keys(o.items)[0],mode:q.mode||"wallet",photo:on("photo"),done:false};
        if(on("done")) submitIssue();}}
    if(on("credit")){S.creditNote=true; S.push={title:"₹30 added to your wallet",body:"Your order was 9 min late because of us."};}
    if(has("new")) document.body.classList.toggle("nonew",q.new==="0");
  }
  function ensureDelivered(feedback){
    if(!S.orders.find(o=>o.id==="#5110")) S.orders.unshift({id:"#5110",when:"Today, 1:00 pm",items:{rajma:1,chai:1},total:188,late:0});
    if(feedback){S.feedback={order:"#5110"}; S.rated={};}
  }
  function submitIssue(){const o=S.orders.find(x=>x.id===S.issueOrder); const t=S.issue.type;
    S.issue.done=true;
    if(t==="safety"){o.fixed="A person will call you about this order";S.toast="Request sent. We'll call you within 30 minutes.";return;}
    const amt=t==="late"?30:item(S.issue.item).price; S.issue.amount=amt;
    if(S.issue.mode==="wallet") S.wallet+=amt;
    o.fixed=`Refunded ${rupee(amt)} to ${S.issue.mode==="wallet"?"your wallet":"UPI"}`;
    S.toast=`${rupee(amt)} refunded`;}

  function resolveRoute(r){
    if(!(r in SCREENS)) r="who";
    if(r!=="who"&&!S.person) r="who";
    if(S.person){const k=PEOPLE[S.person].kind;
      if(k==="kitchen"&&r!=="who") r="kitchen";
      if(k==="rider"&&r!=="who") r="rider";
      if(k==="customer"&&(r==="kitchen"||r==="rider")) r="home";}
    if(r==="track"&&!S.track) r="home";
    return r;}

  function onHash(){const {r,q}=parseHash(); applyParams(r,q); render(true);}
  function render(nav){
    const r=resolveRoute(parseHash().r); const changed=r!==cur;
    const views=$("views"); const old=views.lastElementChild;
    const keep=!changed&&old?[...old.querySelectorAll(".scroll,.hscroll")].map(e=>[e.scrollTop,e.scrollLeft]):null;
    const out=SCREENS[r](); S.route=r;
    const v=document.createElement("div");
    v.className="view "+(out.cls||"")+(changed&&cur?(dir==="back"?" in-back":" in"):"");
    v.innerHTML=out.html+pushNote()+toast();
    views.appendChild(v);
    if(old){ if(changed&&cur){old.classList.add("out");old.style.zIndex=0;v.style.zIndex=1;setTimeout(()=>old.remove(),220);} else old.remove(); }
    [...views.children].slice(0,-2).forEach(e=>e.remove());
    if(keep){[...v.querySelectorAll(".scroll,.hscroll")].forEach((e,i)=>{if(keep[i]){e.scrollTop=keep[i][0];e.scrollLeft=keep[i][1];}});}
    const dark=out.cls==="dark"; $("homebar").classList.toggle("light",dark); $("label").classList.toggle("light",dark);
    cur=r; dir="fwd";
    bind(v);
    const sc=v.querySelector(".scroll");
    if(sc){const f=()=>v.classList.toggle("scrolled",sc.scrollTop>(r==="dish"?300:r==="menu"?190:8)); sc.addEventListener("scroll",f,{passive:true}); f();}
    if(S.toast){const t=S.toast;setTimeout(()=>{if(S.toast===t){S.toast="";const e=v.querySelector(".toast");if(e)e.remove();}},2600);}
    if(S.push){const n=S.push;setTimeout(()=>{if(S.push===n){S.push=null;const e=v.querySelector(".push");if(e)e.remove();}},6000);}
  }
  // S.stack remembers where forward taps came from, so "prev" goes back to the right screen.
  function go(r,back){
    if(back){ if(r==="prev") r=S.stack.pop()||"home"; else { const i=S.stack.lastIndexOf(r); S.stack=i>=0?S.stack.slice(0,i):[]; } }
    else if(S.route&&S.route!==r&&r!=="who") S.stack.push(S.route);
    dir=back?"back":"fwd"; S.sheet=false; if(location.hash==="#"+r) render(true); else location.hash=r;}

  function bind(v){
    const on=(sel,fn)=>v.querySelectorAll(sel).forEach(el=>el.onclick=e=>{e.stopPropagation();fn(el,e);});
    const id=x=>v.querySelector("#"+x);
    on("[data-go]",el=>go(el.dataset.go));
    on("[data-back]",el=>go(el.dataset.back,true));
    on("[data-person]",el=>{const keep=el.dataset.person; reset(); S.person=keep; const k=PEOPLE[keep].kind; go(k==="customer"?"home":k);});
    on("[data-add]",el=>{add(el.dataset.add);render();});
    on("[data-sub]",el=>{sub(el.dataset.sub);render();});
    on("[data-dish]",el=>{S.dish=el.dataset.dish;S.details=false;go("dish");});
    on("[data-cat]",el=>{S.cat=el.dataset.cat; if(S.route==="menu"){render();} else go("menu");});
    on("[data-vf]",el=>{S.vf=S.vf===el.dataset.vf?null:el.dataset.vf;render();});
    on("[data-vegtoggle]",()=>{S.vegOnly=!S.vegOnly;render();});
    on("[data-notify]",el=>{const k=el.dataset.notify;S.notify[k]=!S.notify[k];if(S.notify[k])S.toast=`We'll tell you when ${item(k).name} is quick again.`;render();});
    on("[data-sheet]",()=>{S.sheet=true;render();});
    on("[data-usual]",el=>{S.cart={};el.dataset.usual.split(",").forEach(k=>S.cart[k]=1);go("cart");});
    on("[data-rate]",el=>{const k=el.dataset.rate;S.rated[k]=el.dataset.v;
      if(el.dataset.v==="down"){S.issueOrder=S.feedback.order;S.issue={type:"quality",item:k,mode:"wallet",done:false};go("issue");} else render();});
    on("[data-issue]",el=>{S.issueOrder=el.dataset.issue;S.issue={type:null,item:null,mode:"wallet",done:false};
      if(!S.orders.find(o=>o.id===S.issueOrder)) ensureDelivered(false);
      go("issue");});
    on("[data-type]",el=>{S.issue.type=el.dataset.type;S.issue.item=el.dataset.type==="late"?Object.keys((S.orders.find(o=>o.id===S.issueOrder)||S.orders[0]).items)[0]:null;render();});
    on("[data-item]",el=>{S.issue.item=el.dataset.item;render();});
    on("[data-mode]",el=>{S.issue.mode=el.dataset.mode;render();});
    on("[data-time]",el=>{S.usualTime=el.dataset.time;render();});
    on("[data-stop]",el=>{S.stopped[el.dataset.stop]=true;S.toast=`${el.dataset.stop} stopped. Remaking it; the rider knows it'll be 3 min late.`;render();});
    const sc=id("scrim"); if(sc) sc.onclick=e=>{if(e.target===sc){S.sheet=false;render();}};
    const pu=id("push"); if(pu) pu.onclick=()=>{S.push=null;pu.remove();};
    const dt=id("details"); if(dt) dt.onclick=()=>{S.details=!S.details;render();};
    const cl=id("clear"); if(cl) cl.onclick=()=>{S.cart={};render();};
    const cp=id("coupon"); if(cp) cp.onclick=()=>{S.coupon=!S.coupon;render();};
    const sr=id("savedrow"); if(sr) sr.onclick=()=>{S.savedOpen=!S.savedOpen;render();};
    const kn=id("kitchenNotify"); if(kn) kn.onclick=()=>{S.kitchenNotify=!S.kitchenNotify;if(S.kitchenNotify)S.toast=`We'll tell you when the ${PEOPLE[S.person].kitchen} is back to normal.`;render();};
    const pl=id("place"); if(pl) pl.onclick=()=>{S.track={id:"#5110",step:0,slip:false,items:{...S.cart}};S.cart={};go("track");};
    const nx=id("next"); if(nx) nx.onclick=()=>{const t=S.track; t.step++;
      if(t.step===2&&!t.slipped){t.slip=true;t.slipped=true;S.push={title:"New time 1:15",body:"Lunch rush, your food is being packed."};}
      if(t.step===4){const items=t.items||{rajma:1,chai:1}; if(!S.orders.find(o=>o.id===t.id)) S.orders.unshift({id:t.id,when:"Today, 1:00 pm",items,total:Object.entries(items).reduce((s,[k,n])=>s+item(k).price*n,0),late:0}); S.feedback={order:t.id}; S.rated={};}
      render();};
    const ph=id("photo"); if(ph) ph.onclick=()=>{S.issue.photo=!S.issue.photo;render();};
    const si=id("submitIssue"); if(si) si.onclick=()=>{submitIssue();render();};
    const su=id("setUsual"); if(su) su.onclick=()=>{S.usualSet=true;S.toast=`Done. We'll remind you at ${S.usualTime} on weekdays.`;go("home",true);};
    const rs=id("resume"); if(rs) rs.onclick=()=>{S.paused.paneer=false;S.toast="Paneer tikka roll is back on the menu.";render();};
    const ck=id("checklist"); if(ck) ck.onclick=()=>{S.toast="Batch time, hold time, wrap: all OK.";render();};
    const cr=id("callRider"); if(cr) cr.onclick=()=>{S.toast="Calling Imran…";render();};
    const ac=id("accept"); if(ac) ac.onclick=()=>{S.riderAccepted=true;render();};
  }

  // Fit the phone to short desktop windows.
  function fit(){const d=$("device"); if(innerWidth<=500){d.style.zoom="";return;}
    const avail=innerHeight-110; d.style.zoom=avail<868?(avail/868).toFixed(3):"";}
  addEventListener("resize",fit); fit();
  addEventListener("hashchange",onHash);
  onHash();
})();
</script>
</body>
</html>
